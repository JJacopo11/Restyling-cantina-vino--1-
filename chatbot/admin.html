<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chatbot FAQ Admin</title>
  <link rel="stylesheet" href="/chatbot/admin.css">
</head>
<body>
  <main class="wrap">
    <h1>FAQ — Admin</h1>
    <section class="form">
      <label>Domanda
        <input id="q" placeholder="Es. Quali vini producete?">
      </label>
      <label>Risposta
        <textarea id="a" placeholder="Es. Produciamo Schioppettino, Ribolla..."></textarea>
      </label>
      <button id="add">Aggiungi FAQ</button>
    </section>

    <section>
      <h2>FAQ esistenti</h2>
      <ul id="list" class="faq-list"></ul>
    </section>
  </main>
  <script src="/chatbot/admin.js"></script>
</body>
</html>
